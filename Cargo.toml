[package]
name = "duckbridge-extension"
version = "0.1.2"
edition = "2021"
description = "DuckBridge as a DuckDB extension: import SQL Server databases, run T-SQL on DuckDB, export back as a live load, a restorable .bak, PostgreSQL or Parquet"
license = "MIT"
repository = "https://github.com/singhpratech/duckbridge-extension"
publish = false

# The shared library must be named after the extension: DuckDB derives the entry point
# (duckbridge_init_c_api) from the file name.
[lib]
name = "duckbridge"
crate-type = ["cdylib"]

[lints.rust]
# src/lib.rs selects src/duckdb_neo.rs under `neo`, a feature of the core repo's extension/neo/Cargo.toml
# (the native DuckDB 2.0 build); this crate only builds the v1 backend.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("neo"))'] }

[dependencies]
duckdb = { version = "1.10506", default-features = false, features = ["loadable-extension", "vscalar", "chrono", "uuid", "serde_json"] }
# The engine. src/*.rs is a copy of extension/src/*.rs at this same revision (scripts/sync-from-core.sh).
duckbridge = { git = "https://github.com/singhpratech/duckbridge", rev = "adf3b4f1b0b746680d83bd3a8730e438d3210240", default-features = false, features = ["duckdb-v1"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
