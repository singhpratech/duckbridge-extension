#
# Builds and tests the extension for every DuckDB platform with DuckDB's own extension toolchain,
# exactly as the community-extensions repository does.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  source-in-sync:
    name: src/ matches singhpratech/duckbridge at the pinned revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          REV=$(sed -n 's/.*github.com\/singhpratech\/duckbridge".*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          for f in lib.rs duckdb_v1.rs duckdb_neo.rs; do
            curl -sSfL "https://raw.githubusercontent.com/singhpratech/duckbridge/$REV/extension/src/$f" -o "/tmp/core_$f"
            diff -u "/tmp/core_$f" "src/$f"
          done && echo "in sync with duckbridge@$REV"

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: duckbridge
      extra_toolchains: rust;python3
      # No WebAssembly (needs sockets and threads), no MinGW/RTools (MSVC build), no musl (TLS stack).
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl'

  # The same build with the toolchain the community registry uses for DuckDB 2.0.0 (its build.yml:
  # duckdb_version v2.0.0 at commit d54cbbe3df, ci_tools v2.0-cyanoptera). The stable v1 C API
  # footer this repo produces loads on both engines; the tests here run on pip duckdb (1.5.6).
  duckdb-2-build:
    name: Build extension binaries (DuckDB 2.0 toolchain)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckbridge
      extra_toolchains: rust;python3
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl'
